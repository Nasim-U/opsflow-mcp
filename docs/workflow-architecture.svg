<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" aria-label="OpsFlow MCP Architecture Diagram">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1C" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#A78BFA" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1120" height="500" rx="16" fill="url(#archBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Title Header -->
  <text x="36" y="42" fill="#F8FAFC" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700">
    OpsFlow MCP — Guardrailed Agent-to-Warehouse &amp; Workflow Execution Architecture
  </text>
  <text x="36" y="64" fill="#94A3B8" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5">
    Zero-dependency Node.js 24 native architecture uniting deterministic SKILL.md workflows, JSON-RPC 2.0 guardrails, and bounded-retry playbooks
  </text>

  <!-- COLUMN 1: AI Hosts & Skills -->
  <rect x="32" y="92" width="260" height="374" rx="12" fill="#111A2E" stroke="#283B60" stroke-width="1.5" />
  <text x="50" y="120" fill="#38BDF8" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
    1. AI CLIENTS &amp; AGENT SKILLS
  </text>

  <rect x="48" y="138" width="228" height="84" rx="8" fill="#0B1222" stroke="#1E293B" stroke-width="1" />
  <text x="62" y="160" fill="#F1F5F9" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600">MCP Host Environments</text>
  <text x="62" y="181" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">• Claude Desktop / Code</text>
  <text x="62" y="198" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">• Google Antigravity / Cursor</text>
  <text x="62" y="214" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">• Automated Cron Runners</text>

  <rect x="48" y="238" width="228" height="104" rx="8" fill="#161632" stroke="#4C1D95" stroke-width="1" />
  <text x="62" y="260" fill="#DDD6FE" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600">Reusable Agent Skills Pack</text>
  <text x="62" y="282" fill="#C4B5FD" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">warehouse-analyst/SKILL.md</text>
  <text x="62" y="298" fill="#94A3B8" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5">Catalog lookup → Dedup CTE SQL</text>
  <text x="62" y="318" fill="#C4B5FD" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">weekly-ops-digest/SKILL.md</text>
  <text x="62" y="334" fill="#94A3B8" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5">SLA gate → KPI variance → dryRun</text>

  <rect x="48" y="358" width="228" height="90" rx="8" fill="#0B1222" stroke="#1E293B" stroke-width="1" />
  <text x="62" y="380" fill="#F1F5F9" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Prompt Templates</text>
  <text x="62" y="400" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">• executive-variance-brief</text>
  <text x="62" y="418" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">• incident-root-cause-triage</text>
  <text x="62" y="436" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">• churn-save-plan</text>

  <!-- Connector 1 -> 2 -->
  <line x1="294" y1="245" x2="368" y2="245" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyan)" />
  <rect x="299" y="204" width="66" height="32" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
  <text x="307" y="218" fill="#BAE6FD" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">JSON-RPC</text>
  <text x="305" y="230" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">stdio/HTTP</text>

  <!-- COLUMN 2: OpsFlow MCP Server & Guardrail Layer -->
  <rect x="372" y="92" width="348" height="374" rx="12" fill="#0E1B2E" stroke="#0284C7" stroke-width="1.8" />
  <text x="392" y="120" fill="#38BDF8" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
    2. OPSFLOW MCP SERVER &amp; GUARDRAIL ENGINE
  </text>

  <rect x="390" y="138" width="312" height="72" rx="8" fill="#081120" stroke="#1E3A5F" stroke-width="1" />
  <text x="404" y="159" fill="#E2E8F0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Protocol Router &amp; Sliding-Window Limiter</text>
  <text x="404" y="178" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">initialize · tools/* · resources/* · prompts/*</text>
  <text x="404" y="196" fill="#64748B" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5">60 calls/min rate limit + batch JSON-RPC 2.0 framing</text>

  <rect x="390" y="222" width="312" height="128" rx="8" fill="#071A17" stroke="#10B981" stroke-width="1.2" />
  <text x="404" y="244" fill="#6EE7B7" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="700">Multi-Layer SQL Security Guardrails</text>
  <text x="404" y="265" fill="#D1FAE5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">1. Comment &amp; literal lexical sanitizer</text>
  <text x="404" y="283" fill="#D1FAE5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">2. Single-statement check (no ';' chaining)</text>
  <text x="404" y="301" fill="#D1FAE5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">3. DDL/DML &amp; sqlite_master catalog blocker</text>
  <text x="404" y="319" fill="#D1FAE5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">4. Iterator row cap (&lt;=500) + SHA-256 hash</text>
  <text x="404" y="337" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">5. Engine lock: PRAGMA query_only = ON</text>

  <rect x="390" y="362" width="312" height="86" rx="8" fill="#081120" stroke="#1E3A5F" stroke-width="1" />
  <text x="404" y="383" fill="#E2E8F0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Structured Audit Ring-Buffer (stderr + URI)</text>
  <text x="404" y="403" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">opsflow://audit/recent</text>
  <text x="404" y="422" fill="#94A3B8" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5">Logs requestId, verdict, queryFingerprint, retries</text>
  <text x="404" y="438" fill="#64748B" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5">Zero stdout pollution for clean stdio framing</text>

  <!-- Connectors 2 -> 3 -->
  <line x1="722" y1="195" x2="792" y2="195" stroke="#10B981" stroke-width="2.2" marker-end="url(#arrowGreen)" />
  <line x1="722" y1="365" x2="792" y2="365" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrowPurple)" />

  <!-- COLUMN 3: Warehouse & Playbook Engines -->
  <rect x="796" y="92" width="292" height="190" rx="12" fill="#0C1D1B" stroke="#059669" stroke-width="1.5" />
  <text x="814" y="118" fill="#34D399" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
    3A. SAAS ANALYTICAL WAREHOUSE
  </text>
  <text x="814" y="139" fill="#A7F3D0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Engine: node:sqlite (DatabaseSync)</text>
  <rect x="812" y="150" width="260" height="116" rx="8" fill="#071312" stroke="#134E4A" stroke-width="1" />
  <text x="826" y="170" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">• accounts (ARR, seats, health)</text>
  <text x="826" y="189" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">• revenue_events (idempotency)</text>
  <text x="826" y="208" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">• weekly_kpi_snapshots (WoW)</text>
  <text x="826" y="227" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">• pipeline_runs (SLA &amp; runtime)</text>
  <text x="826" y="246" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">• support_escalations (SEV-1/2)</text>

  <rect x="796" y="298" width="292" height="168" rx="12" fill="#17132B" stroke="#7C3AED" stroke-width="1.5" />
  <text x="814" y="324" fill="#C4B5FD" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
    3B. PLAYBOOK WORKFLOW ENGINE
  </text>
  <rect x="812" y="336" width="260" height="114" rx="8" fill="#0E0B1E" stroke="#4C1D95" stroke-width="1" />
  <text x="826" y="357" fill="#EDE9FE" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">• churn-rescue-sync</text>
  <text x="826" y="376" fill="#EDE9FE" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">• monday-kpi-brief</text>
  <text x="826" y="395" fill="#EDE9FE" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">• pipeline-sla-triage</text>
  <text x="826" y="418" fill="#94A3B8" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5">Exponential backoff + dryRun gate</text>
  <text x="826" y="436" fill="#A78BFA" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">→ Slack Blocks · Salesforce · PagerDuty</text>
</svg>
