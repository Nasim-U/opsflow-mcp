name: OpsFlow MCP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: MCP Protocol, Guardrails, Workbench & Evals (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify screenshot PNG assets
        run: |
          node -e "
          const fs = require('node:fs');
          const sig = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
          for (const p of ['docs/mcp-inspector.png', 'docs/eval-suite.png']) {
            const buf = fs.readFileSync(p);
            if (buf.length < 50000 || !buf.subarray(0, 8).equals(sig)) {
              throw new Error('Invalid screenshot asset: ' + p);
            }
          }
          console.log('PNG screenshot assets verified.');
          "

      - name: Run automated MCP and guardrail test suite
        run: node --test tests/opsflow.test.mjs

      - name: Run 18-case deterministic evaluation benchmark
        run: node src/evals.mjs

      - name: Run CLI protocol trace
        run: node src/cli.mjs demo
